  #   jp2_backend: openjpeg
  #   jp2_rate: 192
  #   jp2_rate_min: 1
  #   jp2_rate_max: 192

  # -------------------------------------------------------------------
  # JPEG2000 actual codec, pre-editor conditioned as block_dct
  # -------------------------------------------------------------------
  - name: jp2_r32_preedit_cond_block_dct
    <<: *preedit_common
    mode: attention_preedit_jpeg2000
    codec_family: block_dct
    jp2_backend: openjpeg
    jp2_rate: 32
    jp2_rate_min: 1
    jp2_rate_max: 192
    condition:
      severity: 0.162304

  - name: jp2_r48_preedit_cond_block_dct
