output_dir: outputs_scope_full_main
device: cuda
category_id_offset: 0
dataset:
  images_dir: datasets/coco-2017/validation/data
  annotations_json: datasets/coco-2017/validation/labels.json

models:
  server_model: models/yolo26x.pt

server_predict:
  conf: 0.001
  iou: 0.7
  max_det: 300
  category_map: coco91

bpg_encoder_bin: bpgenc
bpg_decoder_bin: bpgdec

scope_common: &scope_common
  scope_ckpt: runs/preedit_d2fpn_nojp2_unbiased_linearsev_mediumbpg_sevbasis_scratch_FULL_20260701_140557/best_val.pt
  architecture: scope_bgreplace
  condition_mode: family_severity
  base_ch: 48
  family_emb_dim: 8
  cond_dim: 64
  max_delta_obj: 0.09
  max_delta_bg: 0.03
  attention_bias: -4.0
  bg_mode: blur_replace
  bg_blur_kernel: 51
  bg_lowres_scale: 16

codec_templates:
  jpeg: &jpeg
    mode: uniform
    codec_family: block_dct

  scope_jpeg: &scope_jpeg
    <<: *scope_common
    mode: scope_jpeg
    codec_family: block_dct

  bpg: &bpg
    mode: bpg
    codec_family: intra_smooth
    bpg_qp_min: 0
    bpg_qp_max: 51

  scope_bpg: &scope_bpg
    <<: *scope_common
    mode: scope_bpg
    codec_family: intra_smooth
    bpg_qp_min: 0
    bpg_qp_max: 51

  bmshj: &bmshj
    mode: compressai
    codec_family: learned
    compressai_model: bmshj2018-hyperprior

  scope_bmshj: &scope_bmshj
    <<: *scope_common
    mode: scope_compressai
    codec_family: learned
    compressai_model: bmshj2018-hyperprior

  cheng: &cheng
    mode: compressai
    codec_family: bmshj
    compressai_model: cheng2020-attn

  scope_cheng: &scope_cheng
    <<: *scope_common
    mode: scope_compressai
    codec_family: bmshj
    compressai_model: cheng2020-attn

experiments:
  # JPEG
  - name: jpeg_q10
    <<: *jpeg
    jpeg_quality: 10

  - name: jpeg_q15
    <<: *jpeg
    jpeg_quality: 15

  - name: jpeg_q20
    <<: *jpeg
    jpeg_quality: 20

  - name: jpeg_q30
    <<: *jpeg
    jpeg_quality: 30

  - name: jpeg_q40
    <<: *jpeg
    jpeg_quality: 40

  - name: jpeg_q50
    <<: *jpeg
    jpeg_quality: 50

  # SCOPE + JPEG
  - name: scope_jpeg_q10
    <<: *scope_jpeg
    jpeg_quality: 10
    condition: {severity: 0.908163}

  - name: scope_jpeg_q15
    <<: *scope_jpeg
    jpeg_quality: 15
    condition: {severity: 0.857143}

  - name: scope_jpeg_q20
    <<: *scope_jpeg
    jpeg_quality: 20
    condition: {severity: 0.806122}

  - name: scope_jpeg_q30
    <<: *scope_jpeg
    jpeg_quality: 30
    condition: {severity: 0.704082}

  - name: scope_jpeg_q40
    <<: *scope_jpeg
    jpeg_quality: 40
    condition: {severity: 0.602041}

  - name: scope_jpeg_q50
    <<: *scope_jpeg
    jpeg_quality: 50
    condition: {severity: 0.500000}

  # BPG
  - name: bpg_qp28
    <<: *bpg
    bpg_qp: 28

  - name: bpg_qp31
    <<: *bpg
    bpg_qp: 31

  - name: bpg_qp34
    <<: *bpg
    bpg_qp: 34

  - name: bpg_qp37
    <<: *bpg
    bpg_qp: 37

  - name: bpg_qp41
    <<: *bpg
    bpg_qp: 41

  - name: bpg_qp44
    <<: *bpg
    bpg_qp: 44

  # SCOPE + BPG
  - name: scope_bpg_qp28
    <<: *scope_bpg
    bpg_qp: 28
    condition: {severity: 0.549020}

  - name: scope_bpg_qp31
    <<: *scope_bpg
    bpg_qp: 31
    condition: {severity: 0.607843}

  - name: scope_bpg_qp34
    <<: *scope_bpg
    bpg_qp: 34
    condition: {severity: 0.666667}

  - name: scope_bpg_qp37
    <<: *scope_bpg
    bpg_qp: 37
    condition: {severity: 0.725490}

  - name: scope_bpg_qp41
    <<: *scope_bpg
    bpg_qp: 41
    condition: {severity: 0.803922}

  - name: scope_bpg_qp44
    <<: *scope_bpg
    bpg_qp: 44
    condition: {severity: 0.862745}

  # JPEG2000 experiments are configured separately in configs/ablation.yaml.

  # BMSHJ
  - name: bmshj_q1
