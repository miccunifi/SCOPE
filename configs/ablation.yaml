output_dir: outputs_conditional_scopeV4_ablation_jp2_condition_families
device: cuda
category_id_offset: 0
dataset:
  images_dir: datasets/coco-2017/validation/data
  annotations_json: datasets/coco-2017/validation/labels.json

models:
  server_model: models/yolo26x.pt

server_predict:
  conf: 0.001
  iou: 0.7
  max_det: 300
  category_map: coco91

bpg_encoder_bin: bpgenc
bpg_decoder_bin: bpgdec
jp2_encoder_bin: opj_compress
jp2_decoder_bin: opj_decompress

scope_common: &scope_common
  scope_ckpt: runs/preedit_d2fpn_nojp2_unbiased_linearsev_mediumbpg_sevbasis_scratch_NOOBJECTNESS_20260701_140557/best_val.pt
  architecture: scope_bgreplace
  condition_mode: family_severity
  base_ch: 48
  family_emb_dim: 8
  cond_dim: 64
  max_delta_obj: 0.09
  max_delta_bg: 0.03
  attention_bias: -4.0
  bg_mode: blur_replace
  bg_blur_kernel: 51
  bg_lowres_scale: 16

codec_templates:
  jp2_baseline: &jp2_baseline
    mode: jpeg2000
    codec_family: wavelet
    jp2_backend: openjpeg
    jp2_rate_min: 1
    jp2_rate_max: 192

  jp2_scope_block_dct: &jp2_scope_block_dct
    <<: *scope_common
    mode: scope_jpeg2000
    codec_family: block_dct
    jp2_backend: openjpeg
    jp2_rate_min: 1
    jp2_rate_max: 192

  jp2_scope_learned: &jp2_scope_learned
    <<: *scope_common
    mode: scope_jpeg2000
    codec_family: learned
    jp2_backend: openjpeg
    jp2_rate_min: 1
    jp2_rate_max: 192

  jp2_scope_intra_smooth: &jp2_scope_intra_smooth
    <<: *scope_common
    mode: scope_jpeg2000
    codec_family: intra_smooth
    jp2_backend: openjpeg
    jp2_rate_min: 1
    jp2_rate_max: 192

experiments:
  # JPEG 2000 baseline
  - name: jp2_r32
    <<: *jp2_baseline
    jp2_rate: 32

  - name: jp2_r48
    <<: *jp2_baseline
    jp2_rate: 48

  - name: jp2_r64
    <<: *jp2_baseline
    jp2_rate: 64

  - name: jp2_r96
    <<: *jp2_baseline
    jp2_rate: 96

  - name: jp2_r128
    <<: *jp2_baseline
    jp2_rate: 128

  - name: jp2_r192
    <<: *jp2_baseline
    jp2_rate: 192

  # JPEG 2000 conditioned on block_dct
  - name: jp2_r32_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 32
    condition: {severity: 0.162304}

  - name: jp2_r48_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 48
    condition: {severity: 0.246073}

  - name: jp2_r64_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 64
    condition: {severity: 0.329843}

  - name: jp2_r96_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 96
    condition: {severity: 0.497382}

  - name: jp2_r128_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 128
    condition: {severity: 0.664921}

  - name: jp2_r192_scope_cond_block_dct
    <<: *jp2_scope_block_dct
    jp2_rate: 192
    condition: {severity: 1.000000}

  # JPEG 2000 conditioned on learned
  - name: jp2_r32_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 32
    condition: {severity: 0.162304}

  - name: jp2_r48_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 48
    condition: {severity: 0.246073}

  - name: jp2_r64_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 64
    condition: {severity: 0.329843}

  - name: jp2_r96_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 96
    condition: {severity: 0.497382}

  - name: jp2_r128_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 128
    condition: {severity: 0.664921}

  - name: jp2_r192_scope_cond_learned
    <<: *jp2_scope_learned
    jp2_rate: 192
    condition: {severity: 1.000000}

  # JPEG 2000 conditioned on intra_smooth
  - name: jp2_r32_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 32
    condition: {severity: 0.162304}

  - name: jp2_r48_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 48
    condition: {severity: 0.246073}

  - name: jp2_r64_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 64
    condition: {severity: 0.329843}

  - name: jp2_r96_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 96
    condition: {severity: 0.497382}

  - name: jp2_r128_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 128
    condition: {severity: 0.664921}

  - name: jp2_r192_scope_cond_intra_smooth
    <<: *jp2_scope_intra_smooth
    jp2_rate: 192
    condition: {severity: 1.000000}
