output_dir: outputs_conditional_ablationNOBG
# Use cuda if available. Change to cpu only for debugging.
device: cuda
category_id_offset: 0

dataset:
  images_dir: datasets/coco-2017/validation/data
  annotations_json: datasets/coco-2017/validation/labels.json

models:
  server_model: models/yolo26x.pt

server_predict:
  conf: 0.001
  iou: 0.7
  max_det: 300
  category_map: coco91

# Used only by BPG/JPEG2000 experiments. Safe to keep here.
bpg_encoder_bin: bpgenc
bpg_decoder_bin: bpgdec
jp2_encoder_bin: opj_compress
jp2_decoder_bin: opj_decompress

preedit_common: &preedit_common
  # Use best_loss.pt from the run where epoch 17 had best=1.
  # If you manually copied the file to best_loss17.pt, change this path accordingly.
  preedit_ckpt: runs/preedit_d2fpn_nojp2_unbiased_linearsev_mediumbpg_sevbasis_scratch_NOOBJECTNESS_20260701_140557/best_val.pt
  
  architecture: conditional_attention_preeditor_bgreplace
  condition_mode: family_severity

  base_ch: 48
  family_emb_dim: 8
  cond_dim: 64
  max_delta_obj: 0.09
  max_delta_bg: 0.03
  attention_bias: -4.0

  bg_mode: blur_replace
  bg_blur_kernel: 51
  bg_lowres_scale: 16

experiments:
  # -------------------------------------------------------------------
  # JPEG baseline
  # Training/eval severity uses DiffJPEG full range 1..99.
  # severity = 1 - (quality - 1) / (99 - 1)
  # -------------------------------------------------------------------
  # - name: jpeg_q10
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 10

  # - name: jpeg_q15
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 15

  # - name: jpeg_q20
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 20

  # - name: jpeg_q30
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 30

  # - name: jpeg_q40
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 40

  # - name: jpeg_q50
  #   mode: uniform
  #   codec_family: block_dct
  #   jpeg_quality: 50

  - name: preedit_jpeg_q10
    <<: *preedit_common
    mode: attention_preedit_jpeg
    codec_family: block_dct
    jpeg_quality: 10
    condition:
      severity: 0.908163

  - name: preedit_jpeg_q15
    <<: *preedit_common
    mode: attention_preedit_jpeg
    codec_family: block_dct
    jpeg_quality: 15
    condition:
      severity: 0.857143

  - name: preedit_jpeg_q20
    <<: *preedit_common
    mode: attention_preedit_jpeg
    codec_family: block_dct
    jpeg_quality: 20
    condition:
      severity: 0.806122

  - name: preedit_jpeg_q30
    <<: *preedit_common
    mode: attention_preedit_jpeg
    codec_family: block_dct
    jpeg_quality: 30
    condition:
      severity: 0.704082

  - name: preedit_jpeg_q40
    <<: *preedit_common
    mode: attention_preedit_jpeg
    codec_family: block_dct
    jpeg_quality: 40
